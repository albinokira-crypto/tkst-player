<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 794" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Cantoneira Barroca Clássica -->
    <g id="corner-vintage">
      <path d="M 0,0 L 90,0 C 85,15 75,25 60,30 C 45,35 35,45 30,60 C 25,75 15,85 0,90 Z" fill="#111111"/>
      <path d="M 12,12 L 75,12 C 70,22 62,30 50,34 C 38,38 30,46 26,58 C 22,70 14,78 12,75 Z" fill="#ffffff"/>
      <path d="M 16,16 L 65,16 C 60,24 52,32 42,35 C 32,38 24,46 21,56 C 18,66 10,74 16,65 Z" fill="#111111"/>
      <!-- Arabesco Espiral / Voluta -->
      <path d="M 32,32 C 45,20 60,25 55,38 C 50,50 35,42 40,35 C 44,28 50,32 48,36" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="4" fill="#111111"/>
      <circle cx="78" cy="10" r="3" fill="#111111"/>
      <circle cx="10" cy="78" r="3" fill="#111111"/>
    </g>

    <!-- Ornamento Central de Borda (Topo e Base) -->
    <g id="center-crest">
      <path d="M -50,0 C -30,12 -15,18 0,8 C 15,18 30,12 50,0 C 35,6 20,4 0,16 C -20,4 -35,6 -50,0 Z" fill="#111111"/>
      <circle cx="0" cy="8" r="3.5" fill="#111111"/>
      <path d="M -25,2 C -15,8 0,4 0,10 C 0,4 15,8 25,2" fill="none" stroke="#111111" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Moldura Externa Dupla -->
  <rect x="14" y="14" width="1094" height="766" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="22" y="22" width="1078" height="750" fill="none" stroke="#111111" stroke-width="1"/>
  <rect x="26" y="26" width="1070" height="742" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Filete pontilhado clássico -->
  <rect x="30" y="30" width="1062" height="734" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 4 Cantoneiras Vintage -->
  <use href="#corner-vintage" x="14" y="14" />
  <use href="#corner-vintage" x="1108" y="14" transform="scale(-1, 1)" />
  <use href="#corner-vintage" x="1108" y="780" transform="scale(-1, -1)" />
  <use href="#corner-vintage" x="14" y="780" transform="scale(1, -1)" />

  <!-- Ornamentos de Centro (Topo, Base, Esquerda, Direita) -->
  <use href="#center-crest" x="561" y="26" />
  <use href="#center-crest" x="561" y="768" transform="rotate(180, 561, 768)" />
</svg>
